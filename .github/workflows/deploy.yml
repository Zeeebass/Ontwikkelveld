name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies installeren
        run: npm ci
      - name: Linten
        run: npm run lint
      - name: Unit-tests
        run: npm test
      - name: Productiebuild
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_DEMO_MODE: "false"
        run: npm run build
      - name: Pages configureren
        uses: actions/configure-pages@v5
      - name: Artifact uploaden
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
